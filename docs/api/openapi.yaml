          "404": { "$ref": "#/components/responses/ClientError" }
        }
      }
    },
    "/api/v1/catalog/audio/{contentId}/cover": {
      "get": {
        "operationId": "getPublicAudioCover",
        "summary": "Returns the controlled public cover representation without disclosing its private location.",
        "x-kora-clients": ["mobile", "web"],
        "x-kora-controlled-representation": true,
        "x-kora-content-binding": "ROUTE_CONTENT_ID_AND_REQUIRED_MEDIA_ASSET_VERSION",
        "parameters": [
          { "$ref": "#/components/parameters/ContentId" },
          {
            "name": "mediaAssetVersion",
            "in": "query",
            "required": true,
            "description": "Exact cover version selected by the active publication metadata.",
            "schema": { "type": "integer", "minimum": 1 }
          }
        ],
        "responses": {
          "200": {
            "description": "Controlled cover bytes for the active publication.",
            "content": {
              "image/*": {
                "schema": { "type": "string", "format": "binary" }
              }
            }
          },
          "404": { "$ref": "#/components/responses/ClientError" }
        }
      }
    },
