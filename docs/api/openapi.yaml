    "refreshTokenLifetimeDays": 30,
    "refreshTokenUse": "SINGLE_USE_ROTATING",
    "refreshReplayResponse": "REVOKE_SESSION_FAMILY",
    "successfulLoginSessionPolicy": "ATOMICALLY_REVOKE_ALL_PRIOR_ACTIVE_CUSTOMER_SESSIONS"
  },
