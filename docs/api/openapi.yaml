      "denominator": 10000,
      "granularity": "ARTIST_PER_SETTLEMENT",
      "settlementOrder": "STRICT_PER_ARTIST_SEQUENCE",
      "calculation": "FLOOR_EXACT_NUMERATOR_WITH_CARRY",
