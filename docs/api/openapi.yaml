      "initial": "RECEIVED",
      "terminal": ["PROCESSED", "REJECTED"],
      "transitions": {
        "RECEIVED": ["PROCESSING", "REJECTED"],
        "PROCESSING": ["PROCESSED", "REJECTED"],
        "PROCESSED": [],
        "REJECTED": []
      }
    },
    "MediaWebhookInbox": {
      "initial": "RECEIVED",
      "terminal": ["PROCESSED", "REJECTED"],
      "transitions": {
        "RECEIVED": ["PROCESSING", "REJECTED"],
