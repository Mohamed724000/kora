          "400": { "$ref": "#/components/responses/ClientError" }
        }
      }
    },
    "/api/v1/catalog/audio/{contentId}": {
      "get": {
        "operationId": "getPublicAudioContent",
        "summary": "Gets public audio metadata and preview availability.",
        "x-kora-clients": ["mobile", "web"],
        "parameters": [{ "$ref": "#/components/parameters/ContentId" }],
        "responses": {
          "200": {
            "description": "Published audio metadata.",
