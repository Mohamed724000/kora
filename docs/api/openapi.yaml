      "initial": "DRAFT",
      "terminal": [],
      "transitions": {
        "DRAFT": ["PUBLISHED"],
        "PUBLISHED": ["ARCHIVED"],
        "ARCHIVED": ["PUBLISHED"]
      }
    },
