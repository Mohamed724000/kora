          },
          "checksumSha256": { "type": "string", "pattern": "^[a-f0-9]{64}$" }
        }
      },
      "ArchiveAudioContentRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["reason"],
        "properties": {
          "reason": { "type": "string", "minLength": 3, "maxLength": 240 }
        }
      },
      "AdminAudioContent": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "artist",
          "contentId",
          "createdByAdminId",
          "editorialState",
          "mediaAssets",
          "previewSeconds",
          "priceCfa",
          "title"
        ],
        "properties": {
          "contentId": { "$ref": "#/components/schemas/Identifier" },
          "createdByAdminId": { "$ref": "#/components/schemas/Identifier" },
          "title": { "type": "string", "minLength": 1, "maxLength": 120 },
          "description": { "type": ["string", "null"], "maxLength": 1000 },
          "artist": { "$ref": "#/components/schemas/ArtistSummary" },
          "priceCfa": { "$ref": "#/components/schemas/MoneyCfa" },
          "previewSeconds": { "type": "integer", "minimum": 1, "maximum": 120 },
          "editorialState": {
            "$ref": "#/components/schemas/AudioEditorialState"
          },
          "mediaAssets": {
            "type": "array",
            "maxItems": 20,
            "items": { "$ref": "#/components/schemas/MediaAssetStatus" }
          }
        }
      },
      "AdminAudioEnvelope": {
        "type": "object",
        "additionalProperties": false,
        "required": ["data", "meta"],
        "properties": {
          "data": { "$ref": "#/components/schemas/AdminAudioContent" },
          "meta": { "$ref": "#/components/schemas/ResponseMeta" }
        }
      },
      "AdminAudioPage": {
        "type": "object",
        "additionalProperties": false,
        "required": ["data", "meta"],
        "properties": {
          "data": {
            "type": "array",
            "maxItems": 50,
            "items": { "$ref": "#/components/schemas/AdminAudioContent" }
          },
          "meta": { "$ref": "#/components/schemas/CursorMeta" }
        }
      },
      "CreateMediaAssetRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["audioContentId", "checksumSha256", "kind"],
        "properties": {
          "audioContentId": { "$ref": "#/components/schemas/Identifier" },
          "kind": {
            "type": "string",
            "enum": ["AUDIO_MASTER", "COVER_IMAGE"]
          },
          "checksumSha256": { "type": "string", "pattern": "^[a-f0-9]{64}$" }
        }
      },
      "PrepareMediaAssetRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["byteLength", "checksumSha256"],
        "properties": {
          "byteLength": {
            "type": "integer",
            "minimum": 1,
            "maximum": 1073741824
          },
          "checksumSha256": { "type": "string", "pattern": "^[a-f0-9]{64}$" }
        }
      },
      "MediaAssetStatus": {
        "type": "object",
        "additionalProperties": false,
        "required": ["kind", "mediaAssetId", "processingStatus", "version"],
        "properties": {
          "mediaAssetId": { "$ref": "#/components/schemas/Identifier" },
          "kind": {
            "type": "string",
            "enum": ["AUDIO_MASTER", "COVER_IMAGE"]
          },
          "processingStatus": {
            "$ref": "#/components/schemas/MediaProcessingStatus"
          },
          "version": { "type": "integer", "minimum": 1 },
          "durationSeconds": {
            "type": ["integer", "null"],
            "minimum": 1,
            "maximum": 86400
          },
          "safeFailureCode": { "type": ["string", "null"], "maxLength": 80 }
        }
      },
      "MediaAssetEnvelope": {
        "type": "object",
        "additionalProperties": false,
        "required": ["data", "meta"],
        "properties": {
          "data": { "$ref": "#/components/schemas/MediaAssetStatus" },
          "meta": { "$ref": "#/components/schemas/ResponseMeta" }
        }
      },
      "MediaPreparation": {
        "type": "object",
        "additionalProperties": false,
        "readOnly": true,
        "x-kora-non-persistable": true,
        "x-kora-non-loggable": true,
        "required": ["expiresAt", "expiresInSeconds", "preparationToken"],
        "properties": {
          "preparationToken": {
            "type": "string",
            "minLength": 32,
            "maxLength": 4096,
            "description": "Opaque one-time capability; never a provider or storage location."
          },
          "expiresInSeconds": {
            "type": "integer",
            "minimum": 1,
            "maximum": 300
          },
          "expiresAt": { "$ref": "#/components/schemas/Timestamp" }
        }
      },
      "MediaPreparationEnvelope": {
        "type": "object",
        "additionalProperties": false,
        "required": ["data", "meta"],
        "properties": {
          "data": { "$ref": "#/components/schemas/MediaPreparation" },
          "meta": { "$ref": "#/components/schemas/ResponseMeta" }
        }
      }
    }
  }
}
