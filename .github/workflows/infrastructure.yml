name: Infrastructure

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrastructure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Node.js 22.18.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Prepare and validate Compose
        run: |
          npm run infra:prepare
          npm run infra:validate
          npm run infra:pull
      - name: Start and verify lifecycle
        run: |
          npm run infra:up
          npm run infra:status
          npm run infra:check
          npm run infra:verify
      - name: Build and verify API health transitions
        run: |
          npm run build --workspace @kora-plus/api
          npm run infra:verify-api
      - name: Stop local infrastructure
        if: always()
        run: npm run infra:down
