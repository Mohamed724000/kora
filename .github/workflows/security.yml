name: Security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Node.js 22.18.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.18.0
          cache: npm
      - name: Flutter 3.44.1
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - name: Install without lifecycle scripts
        run: |
          npm ci --ignore-scripts
          flutter pub get --directory apps/mobile
      - name: Audit dependency trees
        run: |
          npm ls --all
          npm audit --audit-level=low
          npm audit --omit=dev --audit-level=low
          npm run licenses
          flutter pub deps --directory apps/mobile
      - name: Scan repository and history
        run: npm run security:scan
      - name: Validate foundation OpenAPI
        run: npm run openapi:validate
      - name: Verify lockfiles are deterministic
        run: git diff --exit-code -- package-lock.json apps/mobile/pubspec.lock
