worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 256;
}

http {
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client-body;
  proxy_temp_path /tmp/proxy;

  map $host $kora_c3_allowed_host {
    default 0;
    admin.c3.invalid 1;
    127.0.0.1 1;
  }

  server {
    listen 8443 ssl;
    server_name admin.c3.invalid;

    ssl_certificate /run/secrets/c3-entry-cert.pem;
    ssl_certificate_key /run/secrets/c3-entry-key.pem;
    ssl_protocols TLSv1.3;
    ssl_session_tickets off;

    client_max_body_size 64k;

    if ($kora_c3_allowed_host = 0) {
      return 421;
    }

    location / {
      proxy_http_version 1.1;
      proxy_pass http://admin:3000;
      proxy_pass_request_headers off;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_redirect off;
      proxy_hide_header Cache-Control;
      proxy_hide_header X-Content-Type-Options;

      proxy_set_header Host admin.c3.invalid;
      proxy_set_header Accept $http_accept;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Content-Length $content_length;
      proxy_set_header Content-Type $content_type;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Idempotency-Key $http_idempotency_key;
      proxy_set_header Next-Hmr-Refresh $http_next_hmr_refresh;
      proxy_set_header Next-Router-Prefetch $http_next_router_prefetch;
      proxy_set_header Next-Router-Segment-Prefetch $http_next_router_segment_prefetch;
      proxy_set_header Next-Router-State-Tree $http_next_router_state_tree;
      proxy_set_header Next-Url $http_next_url;
      proxy_set_header Origin $http_origin;
      proxy_set_header Rsc $http_rsc;
      proxy_set_header Sec-Fetch-Dest $http_sec_fetch_dest;
      proxy_set_header Sec-Fetch-Mode $http_sec_fetch_mode;
      proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
      proxy_set_header X-Kora-C3-Global-State-Probe $http_x_kora_c3_global_state_probe;
      proxy_set_header X-Kora-CSRF $http_x_kora_csrf;
      proxy_set_header X-Kora-Admin-Client-IP $remote_addr;

      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options "nosniff" always;
    }
  }
}
